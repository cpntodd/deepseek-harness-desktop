# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
    - id: desktop-subscriptions
      name: dsh-plugin-desktop/subscriptions
    - id: desktop-escalation-protocol
      name: dsh-plugin-desktop/escalation-protocol
    - id: desktop-sandbox-escalation-guard
      name: dsh-plugin-desktop/sandbox-escalation-guard
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []

# The desktop owns the provider configuration page: disable the upstream
# ui-settings-models section (and its first-run onboarding dialogs) so the
# desktop's combined Models page is the single provider surface. Keeping both
# would list two settings tabs (the nav projects every raw settings.section
# entry), and the desktop page covers API keys, subscriptions, and adding
# providers.
- id: ui-settings-models
  disabled: true

# Desktop supplies the toggle-enabled inventory tab; disable the upstream
# read-only inventory contribution.
- id: ui-settings-plugin-inventory
  disabled: true

# The desktop owns the permission policy. The upstream base bundle derives the
# sandbox-policy, approval, and permission rows from DSH_PERMISSION_MODE, which
# the desktop never sets; replacing those rows here removes the upstream
# policy so no env-derived default can leak into the desktop generation. The
# launcher then projects the persisted Desktop permission preset
# (dsh-desktop.permissionPreset) onto these rows at generation time, so Read
# Only, Workspace Write, and Full Access are enforced by the sandbox/approval
# services the desktop composes.
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: ask
- id: permission
  config:
    defaultPreset: workspace-write
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
